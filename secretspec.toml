[project]
name = "arboters"
revision = "1.0"

[profiles.default]
ARBOTERS_ZULIP__SITE = { description = "Zulip organization URL, for example https://lichess4545.zulipchat.com", required = true, prompt = true }
ARBOTERS_ZULIP__EMAIL = { description = "Email address of the arboters Zulip bot", required = true, prompt = true }
ARBOTERS_ZULIP__API_KEY = { description = "API key of the arboters Zulip bot", required = true, prompt = true }
ARBOTERS_LICHESS__TOKEN = { description = "Lichess API token of the lichess4545 account, which may stream games of up to 900 users per connection", required = true, prompt = true }
ARBOTERS_HELTOUR__TOKEN = { description = "heltour API token for lichess4545.com, used to read the current pairings", required = true, prompt = true }
OTEL_EXPORTER_OTLP_ENDPOINT = { description = "OTLP collector URL; telemetry is exported only when set", required = false }
OTEL_EXPORTER_OTLP_HEADERS = { description = "OTLP request headers, such as collector credentials", required = false }

[profiles.development]
