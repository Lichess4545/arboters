name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Check nixpkgs and rust-overlay pins match
        run: ci/nixpkgs-pin.sh

      - name: Start Postgres
        run: devenv up --detach postgres

      - name: Migrate
        run: devenv shell -- bash -c 'until pg_isready --quiet; do sleep 1; done; db-migrate'

      - name: Check formatting
        run: devenv shell -- cargo fmt --check

      - name: Lint
        run: devenv shell -- cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: devenv shell -- cargo nextest run

      - name: Run doc tests
        run: devenv shell -- cargo test --doc

      - name: Check sqlx offline data
        run: devenv shell -- bash -c 'SQLX_OFFLINE=false cargo sqlx prepare --check -- --all-targets'

      - name: Validate Kubernetes manifests
        run: devenv shell -- bash -c 'render-manifests | kubeconform -strict -summary -'

  nix:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
